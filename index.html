<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carteira de Aluguéis</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#E8501A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aluguéis">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Ideia: cada imóvel é uma chave no claviculário. Etiqueta de chave com código, placa de rua para o status, régua de ocupação no topo. */
:root{
  --bg:#ECEFEA; --surface:#FBFCFA; --sunk:#E2E7E1; --ink:#11211D; --muted:#5C6B66; --line:#D3DAD3;
  --accent:#E8501A; --accent-ink:#FFFFFF; --placa:#FFD43A; --placa-ink:#1A1A12;
  --ok:#1E8757; --warn:#A96A12; --info:#2A67AD; --off:#76827C; --bad:#C0392B;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(17,33,29,.06),0 8px 24px -12px rgba(17,33,29,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1715; --surface:#15221F; --sunk:#0F1B19; --ink:#E9F0EB; --muted:#94A49D; --line:#283934;
    --accent:#FF7240; --accent-ink:#1A0D06; --ok:#4CC790; --warn:#E3B04B; --info:#74AAE8; --off:#8C9892; --bad:#F0715F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1715; --surface:#15221F; --sunk:#0F1B19; --ink:#E9F0EB; --muted:#94A49D; --line:#283934;
  --accent:#FF7240; --accent-ink:#1A0D06; --ok:#4CC790; --warn:#E3B04B; --info:#74AAE8; --off:#8C9892; --bad:#F0715F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
.fora .nav,.fora .fab{display:none}
.sync{margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)}
.sync + .nav{margin-left:0}
.login{max-width:420px;margin:0 auto;padding:48px 0;display:grid;gap:18px;justify-items:start}
.login h1{font-size:clamp(36px,10vw,56px);font-weight:800;line-height:.95}
.login form{width:100%}
.rodape{display:flex;gap:10px;flex-wrap:wrap;padding:32px 0 0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:96px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

/* topo */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{font:800 20px/1 var(--display);letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.brand i{width:26px;height:26px;border-radius:50%;background:var(--accent);position:relative;flex:none}
.brand i::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg)}
.nav{margin-left:auto;display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.nav button{padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.banner{background:var(--placa);color:var(--placa-ink);font-size:14px;font-weight:600;padding:8px 16px;text-align:center}

/* herói: régua de ocupação */
.hero{padding:28px 0 8px;display:grid;gap:18px}
.hero h1{font-size:clamp(34px,8vw,64px);font-weight:800;line-height:.95}
.hero h1 em{font-style:normal;color:var(--accent)}
.regua{display:flex;gap:5px;height:44px}
.regua button{flex:1;min-width:10px;border-radius:8px;position:relative;transition:transform .15s}
.regua button:hover{transform:translateY(-3px)}
.s-disponivel{background:var(--placa)} .s-alugado{background:var(--ok)} .s-reservado{background:var(--info)} .s-reforma{background:var(--off)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda b{width:10px;height:10px;border-radius:3px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.stat small{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat strong{font:700 22px/1.15 var(--display);letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}

/* filtros */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:20px 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:180px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:46px}
textarea{min-height:92px;resize:vertical}
.tools select{width:auto}

/* cartões */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;transition:transform .18s}
.card:hover{transform:translateY(-4px)}
.foto{position:relative;aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--sunk) 0 12px,var(--bg) 12px 24px);display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:600}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:12px;left:12px;background:var(--surface);color:var(--ink);font:700 12px/1 var(--display);letter-spacing:.06em;padding:8px 12px 8px 26px;border-radius:999px 8px 8px 999px;box-shadow:var(--shadow)}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--muted)}
.placa{font:800 12px/1 var(--display);letter-spacing:.12em;padding:7px 10px;border-radius:5px;display:inline-block;color:#fff;white-space:nowrap}
.placa.s-disponivel{color:var(--placa-ink)}
.foto .placa{position:absolute;left:12px;bottom:12px;transform:rotate(-2.5deg);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.nfotos{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px}
.card-b{padding:14px 16px 16px;display:grid;gap:6px}
.card-b h3{font-size:19px;font-weight:700}
.end{font-size:14px;color:var(--muted)}
.preco{font:700 20px/1.2 var(--display)}
.preco small{font:500 13px var(--body);color:var(--muted)}
.avisos{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.pill.warn{color:var(--warn)} .pill.info{color:var(--info)} .pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)}

.vazio{border:2px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;display:grid;gap:14px;justify-items:center;color:var(--muted)}
.vazio .placa{font-size:22px;padding:14px 20px;transform:rotate(-3deg)}
.vazio h2{color:var(--ink);font-size:24px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.fab{position:fixed;right:16px;bottom:20px;z-index:15;box-shadow:0 10px 26px -8px var(--accent);min-height:54px;border-radius:999px;padding:0 22px}
.link{font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* detalhe */
.voltar{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--muted);padding:16px 0 10px}
.galeria{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.galeria>*{flex:none;height:230px;border-radius:14px;overflow:hidden;scroll-snap-align:start;position:relative;background:var(--sunk)}
.galeria button.ft{width:min(78vw,340px)}
.galeria img{width:100%;height:100%;object-fit:cover}
.capa{position:absolute;left:8px;top:8px;background:var(--placa);color:var(--placa-ink);font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px}
.addfoto{width:150px;border:2px dashed var(--line);background:transparent !important;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:600;font-size:14px;padding:10px}
.addfoto b{font:700 34px/1 var(--display);color:var(--accent);display:block}
.dhead{display:grid;gap:10px;padding:16px 0 6px}
.dhead h1{font-size:clamp(28px,6vw,44px);font-weight:800;line-height:1}
.dhead .linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag.inline{position:static;display:inline-block;box-shadow:none;border:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:14px}
.seg button{padding:10px 4px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{color:#fff}
.seg button[aria-pressed="true"].s-disponivel{color:var(--placa-ink)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:18px 0;overflow-x:auto}
.tabs button{padding:12px 0;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs sup{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 6px;margin-left:4px}
.painel{display:grid;gap:16px}
@media(min-width:860px){.painel.duas{grid-template-columns:1fr 1fr;align-items:start}}
.bloco{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:grid;gap:12px}
.bloco h2{font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;margin:0}
.dl dt{color:var(--muted)} .dl dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.lista{display:grid;gap:0;margin:0;padding:0;list-style:none}
.lista li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lista li:first-child{border-top:0}
.lista .g{flex:1;min-width:0}
.lista small{display:block;color:var(--muted);font-size:13px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:10px;font-weight:700}
.total strong{font:800 24px var(--display)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.lead{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.lead-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.lead-h h3{font-size:18px}
.contatos{display:flex;flex-wrap:wrap;gap:8px;font-size:14px}
.visita{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:14px;flex-wrap:wrap}
.visita .g{flex:1;min-width:120px}
.icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:18px;flex:none}
.icon:hover{background:var(--sunk);color:var(--ink)}
.nota{font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}

/* agenda */
.dia{display:grid;gap:10px;margin-bottom:22px}
.dia h2{font-size:15px;font-family:var(--body);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.ag{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ag .hora{font:800 22px var(--display);min-width:64px}
.ag .g{flex:1;min-width:150px}

/* folha/modal */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(8,14,12,.55)}
.sheet-card{position:relative;background:var(--bg);width:min(100%,560px);max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 18px;display:grid;gap:14px;animation:sobe .22s ease-out}
@media(min-width:620px){.sheet{align-items:center}.sheet-card{border-radius:22px}}
@keyframes sobe{from{transform:translateY(24px);opacity:.6}}
.sheet-card h2{font-size:24px;font-weight:800}
.campos{display:grid;gap:12px;grid-template-columns:repeat(6,1fr)}
.f{grid-column:span 6;display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.f.c3{grid-column:span 3}.f.c2{grid-column:span 2}.f.c4{grid-column:span 4}
.sheet-acoes{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.sheet-acoes .esq{margin-right:auto}
.light{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;grid-template-rows:1fr auto;color:#fff}
.light[hidden]{display:none}
.light img{width:100%;height:100%;object-fit:contain;min-height:0}
.light-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}
.light-bar .btn{background:rgba(255,255,255,.14);color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:70;max-width:90%;text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><i></i>Carteira</div>
  <span class="sync" id="sync" role="status"></span>
  <nav class="nav" aria-label="Seções">
    <button type="button" data-act="nav" data-v="imoveis" id="nav-imoveis">Imóveis</button>
    <button type="button" data-act="nav" data-v="agenda" id="nav-agenda">Agenda</button>
  </nav>
</div></header>
<div id="banner"></div>
<main class="wrap" id="app"></main>
<button type="button" class="btn acc fab" data-act="novo-imovel" id="fab">+ Novo imóvel</button>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-act="fechar-sheet"></div>
  <form class="sheet-card" id="sheetForm" novalidate></form>
</div>
<div class="light" id="light" hidden>
  <img id="lightImg" alt="Foto do imóvel">
  <div class="light-bar">
    <button type="button" class="btn sm" data-act="light-ant">‹ Anterior</button>
    <button type="button" class="btn sm" data-act="light-prox">Próxima ›</button>
    <button type="button" class="btn sm" data-act="light-capa">Usar como capa</button>
    <button type="button" class="btn sm" data-act="light-del">Excluir foto</button>
    <button type="button" class="btn sm" data-act="light-fechar">Fechar</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const numIn = n => n ? Number(n).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) : '';
const parseBRL = s => { s = String(s || '').replace(/[^\d,.-]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const hojeStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dias = d => Math.round((new Date(d + 'T00:00') - new Date(hojeStr() + 'T00:00')) / 864e5);
const fData = (d, o) => d ? new Date(d + 'T00:00').toLocaleDateString('pt-BR', o || {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
const fDia = d => { const n = dias(d); const base = fData(d, {weekday:'long', day:'numeric', month:'long'}); return n === 0 ? 'Hoje · ' + base : n === 1 ? 'Amanhã · ' + base : base; };

const STATUS = {disponivel:['Disponível','ALUGA-SE'], reservado:['Reservado','RESERVADO'], alugado:['Alugado','ALUGADO'], reforma:['Em reforma','EM REFORMA']};
const ESTAGIO = {novo:'Novo contato', visita:'Visita marcada', proposta:'Fez proposta', fechado:'Fechou', desistiu:'Desistiu'};
const VSTATUS = {agendada:'Agendada', realizada:'Realizada', cancelada:'Cancelada', faltou:'Não compareceu'};
const FREQ = {mensal:'por mês', anual:'por ano', unico:'uma vez'};

const state = {props:[], loaded:false, erro:false, logado:false, view:'imoveis', openId:null, tab:'resumo', fTipo:'todos', fStatus:'todos', q:''};
const API_FIXA = ''; // Opcional: cole aqui o endereço do app da web do Apps Script (termina em /exec)
const ls = { get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };
const apiUrl = () => API_FIXA || ls.get('ca_api');
let token = ls.get('ca_token'), pend = 0, ultima = 0;
const filas = {}, urls = {};
async function api(acao, dados) {
  let j;
  try { const r = await fetch(apiUrl(), {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({acao, token}, dados || {}))}); j = await r.json(); }
  catch (e) { throw new Error('rede'); }
  if (!j.ok) { if (j.erro === 'sessao') sair(true); throw new Error(j.erro || 'erro'); }
  return j;
}
function sincronia() { const el = $('#sync'); if (el) el.textContent = pend > 0 ? 'Salvando…' : ''; }
function sair(expirou) {
  if (!expirou && token) api('sair').catch(() => {});
  token = ''; ls.set('ca_token', ''); state.logado = false; state.loaded = false; state.props = []; state.openId = null; render();
  if (expirou) toast('Sua sessão expirou. Entre de novo.');
}
const NOMES_PADRAO = ['IPTU','Condomínio','Seguro incêndio','Taxa de administração','Manutenção','Energia','Água','Internet'];
let nomesCusto = [];
function nomesSalvos() {
  const vistos = new Set(), out = [];
  [...NOMES_PADRAO, ...nomesCusto, ...state.props.flatMap(p => (p.custos || []).map(c => c.nome))].forEach(n => { const k = String(n || '').trim().toLowerCase(); if (k && !vistos.has(k)) { vistos.add(k); out.push(String(n).trim()); } });
  return out;
}
function lembrarNome(n) {
  if (nomesSalvos().some(x => x.toLowerCase() === n.toLowerCase())) return;
  nomesCusto.push(n);
  api('ajuste', {chave: 'nomesCusto', valor: nomesCusto}).catch(() => {});
}
const encargosInquilino = p => (p.custos || []).filter(c => c.pagoPor === 'inquilino').reduce((s, c) => s + (c.freq === 'mensal' ? c.valor : c.freq === 'anual' ? c.valor / 12 : 0), 0);

/* ---------- dados ---------- */
function salvar(p) {
  p.atualizadoEm = new Date().toISOString();
  const i = state.props.findIndex(x => x.id === p.id);
  if (i >= 0) state.props[i] = p; else state.props.push(p);
  render();
  const data = clone(p); pend++; sincronia();
  filas[p.id] = (filas[p.id] || Promise.resolve()).then(() => api('salvar', {imovel: data})).catch(e => {
    if (e.message !== 'sessao') toast(e.message === 'grande' ? 'Este imóvel tem informação demais para salvar. Apague anotações antigas.' : 'Não foi possível salvar. Verifique a conexão e tente de novo.');
  }).then(() => { pend--; sincronia(); });
  return filas[p.id];
}
const getP = id => state.props.find(p => p.id === id);
const editavel = id => { const p = getP(id); return p ? clone(p) : null; };
const custoMensal = p => (p.custos || []).filter(c => c.pagoPor !== 'inquilino').reduce((s, c) => s + (c.freq === 'mensal' ? c.valor : c.freq === 'anual' ? c.valor / 12 : 0), 0);
const capaDe = p => { const f = p.fotos || []; return f.find(x => x.id === p.capa) || f[0]; };
const endCurto = p => { const e = p.endereco || {}; return [[e.rua, e.numero].filter(Boolean).join(', '), e.bairro, e.cidade].filter(Boolean).join(' · '); };
const endLongo = p => { const e = p.endereco || {}; return [[e.rua, e.numero].filter(Boolean).join(', '), e.complemento, e.bairro, [e.cidade, e.uf].filter(Boolean).join(' - '), e.cep].filter(Boolean).join(', '); };
function visitasDe(p) { const out = []; (p.interessados || []).forEach(l => (l.visitas || []).forEach(v => out.push({p, l, v}))); return out; }
const todasVisitas = () => state.props.flatMap(visitasDe).sort((a, b) => (a.v.data + (a.v.hora || '')).localeCompare(b.v.data + (b.v.hora || '')));
const proxVisita = p => visitasDe(p).filter(x => x.v.status === 'agendada' && dias(x.v.data) >= 0).sort((a, b) => (a.v.data + a.v.hora).localeCompare(b.v.data + b.v.hora))[0];
function novoCodigo(tipo) {
  const pre = tipo === 'comercial' ? 'COM' : 'RES';
  const max = state.props.filter(p => (p.codigo || '').startsWith(pre)).reduce((m, p) => Math.max(m, parseInt(p.codigo.split('-')[1]) || 0), 0);
  return pre + '-' + String(max + 1).padStart(2, '0');
}

}

const podeFoto = () => true;
let idb = null;
const idbPronto = new Promise(res => { try { const r = indexedDB.open('carteira-fotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('f'); r.onsuccess = () => { idb = r.result; res(); }; r.onerror = () => res(); } catch (e) { res(); } });
const idbGet = k => new Promise(res => { if (!idb) return res(null); try { const r = idb.transaction('f').objectStore('f').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } });
const idbPut = (k, b) => { try { if (idb) idb.transaction('f', 'readwrite').objectStore('f').put(b, k); } catch (e) {} };
const esperas = {}; let lote = [], loteT = null;
function pedirFoto(k) {
  if (urls[k]) return Promise.resolve(urls[k]);
  if (!esperas[k]) { const e = esperas[k] = {}; e.p = new Promise(r => e.ok = r); lote.push(k); clearTimeout(loteT); loteT = setTimeout(buscarLote, 40); }
  return esperas[k].p;
}
function entregar(k, blob) { if (blob) urls[k] = URL.createObjectURL(blob); const e = esperas[k]; delete esperas[k]; if (e) e.ok(urls[k] || ''); }
async function buscarLote() {
  const ks = lote; lote = []; await idbPronto; const faltam = [];
  for (const k of ks) { const b = await idbGet(k); if (b) entregar(k, b); else faltam.push(k); }
  for (let i = 0; i < faltam.length; i += 6) {
    const parte = faltam.slice(i, i + 6);
    try { const r = await api('fotos', {ids: parte});
      for (const k of parte) { const b64 = r.fotos && r.fotos[k]; if (!b64) { entregar(k, null); continue; }
        const blob = await (await fetch('data:image/jpeg;base64,' + b64)).blob(); idbPut(k, blob); entregar(k, blob); }
    } catch (e) { parte.forEach(k => entregar(k, null)); }
  }
}
function hidratar() { document.querySelectorAll('img[data-foto]:not([src])').forEach(im => pedirFoto(im.dataset.foto).then(u => { if (u && im.isConnected) im.src = u; })); }
async function encolher(file, max, q) {
  const bmp = await createImageBitmap(file), s = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const b = await new Promise(r => c.toBlob(r, 'image/jpeg', q)); if (!b) throw new Error('imagem'); return b;
}
const b64De = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function enviarFotos(files) {
  const pid = state.openId; if (!pid || !files.length) return;
  const novas = []; let falhas = 0;
  for (let i = 0; i < files.length; i++) {
    toast('Enviando foto ' + (i + 1) + ' de ' + files.length + '…');
    try { const g = await encolher(files[i], 1600, .82), m = await encolher(files[i], 640, .75);
      const r = await api('upload', {b64: await b64De(g), t64: await b64De(m)});
      urls[r.id] = URL.createObjectURL(g); urls[r.t] = URL.createObjectURL(m); idbPut(r.id, g); idbPut(r.t, m); novas.push({id: r.id, t: r.t});
    } catch (e) { falhas++; }
  }
  if (novas.length) { const x = editavel(pid); if (!x) return; x.fotos = (x.fotos || []).concat(novas); if (!x.capa) x.capa = x.fotos[0].id; salvar(x); }
  toast(falhas ? falhas + ' foto(s) não puderam ser enviadas. Tente de novo.' : novas.length + (novas.length === 1 ? ' foto adicionada.' : ' fotos adicionadas.'));
}
let lightI = 0;
function abrirLight(i) {
  const p = getP(state.openId), fs = p && (p.fotos || []); if (!fs || !fs.length) { $('#light').hidden = true; return; }
  lightI = (i + fs.length) % fs.length; const f = fs[lightI], im = $('#lightImg'), idx = lightI, rapida = urls[f.id] || urls[f.t || f.id];
  if (rapida) im.src = rapida; else im.removeAttribute('src');
  $('#light').hidden = false;
  pedirFoto(f.id).then(u => { if (u && lightI === idx && !$('#light').hidden) im.src = u; });
}

      const x = editavel(pid), f = x.fotos.splice(lightI, 1)[0]; if (x.capa === f.id) x.capa = x.fotos[0] ? x.fotos[0].id : null; await salvar(x);

  catch (e) { bt.disabled = false; msg.textContent = ({senha: 'Senha incorreta.', bloqueado: 'Muitas tentativas erradas. Aguarde 10 minutos.', configurar: 'Troque a senha padrão no Code.gs e publique uma nova versão.', rede: 'Não consegui falar com o serviço. Confira o endereço e a conexão.'})[e.message] || 'Não foi possível entrar.'; }
});
async function carregar(silencioso) {
  try { const r = await api('listar');
    state.props = (r.imoveis || []).sort((a, b) => String(a.criadoEm).localeCompare(String(b.criadoEm)));
    nomesCusto = (((r.ajustes || {}).nomesCusto) || []).filter(n => typeof n === 'string');
    state.loaded = true; state.erro = false; ultima = Date.now(); }
  catch (e) { if (e.message === 'sessao') return; if (silencioso) return; state.loaded = true; state.erro = true; }
  render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.logado && state.loaded && !pend && $('#sheet').hidden && Date.now() - ultima > 60000) carregar(true); });
function iniciar() {
  if (location.hash === '#agenda') state.view = 'agenda';
  state.logado = !!(token && apiUrl()); render();
  if (state.logado) carregar();
}
iniciar();
